name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traydcraft
          POSTGRES_PASSWORD: traydcraft
          POSTGRES_DB: traydcraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traydcraft" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://traydcraft:traydcraft@localhost/traydcraft
      TYPST_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Typst
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: OpenAPI document is up to date
        run: |
          cargo run -q -p traydcraft-api -- openapi > api/openapi.json
          git diff --exit-code api/openapi.json

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generated API client is up to date
        run: |
          dart run swagger_parser
          dart run build_runner build -d
          git diff --exit-code lib/api/generated
      - run: flutter analyze
      - run: flutter test
