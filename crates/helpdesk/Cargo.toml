[package]
name = "traydcraft-helpdesk"
description = "Helpdesk: tickets from e-mail, prepared answers in five languages, outbound mail."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
traydcraft-core.workspace = true
traydcraft-crm.workspace = true
traydcraft-sales.workspace = true
traydcraft-documents.workspace = true
anyhow.workspace = true
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
axum.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.9"
rand = "0.9"
rust_decimal.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
webpki-roots = "0.26"
