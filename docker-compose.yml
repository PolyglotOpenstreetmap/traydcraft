# Local development stack: PostgreSQL + API (development authentication, seed data).
#   docker compose up --build
# API: http://localhost:8080  ·  API docs: http://localhost:8080/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: traydcraft
      POSTGRES_PASSWORD: traydcraft
      POSTGRES_DB: traydcraft
    ports:
      - "127.0.0.1:5433:5432"   # 5433: the host often already runs its own PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traydcraft"]
      interval: 2s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traydcraft:traydcraft@db/traydcraft
      AUTH_MODE: dev            # never on a reachable server; use oidc in production
      # Inside the container the API binds 0.0.0.0, which dev auth only accepts when
      # acknowledged. This is safe solely because the port above is published on loopback.
      ALLOW_INSECURE_DEV_AUTH: "true"
      SEED_DEV_DATA: "true"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8080:8080"   # loopback only: dev auth trusts X-Dev-User

  worker:
    build: .
    command: ["traydcraft-worker"]
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql://traydcraft:traydcraft@db/traydcraft
      # Development: outgoing e-mails are written to /app/outbox instead of being sent.
      MAIL_TRANSPORT: files
      MAIL_FILES_DIR: /app/outbox
      # Incoming mail (optional):
      # IMAP_HOST: imap.example.com
      # IMAP_USER: helpdesk@example.com
      # IMAP_PASSWORD: ...
      # Real sending:
      # MAIL_TRANSPORT: smtp
      # SMTP_HOST: smtp.example.com
      # SMTP_USER / SMTP_PASSWORD
      POLL_SECONDS: "15"
      RUST_LOG: info

volumes:
  pgdata:
