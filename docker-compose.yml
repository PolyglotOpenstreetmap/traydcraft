# Local development stack: PostgreSQL + API (development authentication, seed data).
#   docker compose up --build
# API: http://localhost:8080  ·  API docs: http://localhost:8080/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: traydcraft
      POSTGRES_PASSWORD: traydcraft
      POSTGRES_DB: traydcraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traydcraft"]
      interval: 2s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traydcraft:traydcraft@db/traydcraft
      AUTH_MODE: dev            # never on a reachable server; use oidc in production
      SEED_DEV_DATA: "true"
      RUST_LOG: info
    ports:
      - "8080:8080"

  worker:
    build: .
    command: ["traydcraft-worker"]
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql://traydcraft:traydcraft@db/traydcraft
      # Development: outgoing e-mails are written to /app/outbox instead of being sent.
      MAIL_TRANSPORT: files
      MAIL_FILES_DIR: /app/outbox
      # Incoming mail (optional):
      # IMAP_HOST: imap.example.com
      # IMAP_USER: helpdesk@example.com
      # IMAP_PASSWORD: ...
      # Real sending:
      # MAIL_TRANSPORT: smtp
      # SMTP_HOST: smtp.example.com
      # SMTP_USER / SMTP_PASSWORD
      POLL_SECONDS: "15"
      RUST_LOG: info

volumes:
  pgdata:
